# Production deploy to Cloudflare Pages, triggered by pushing a tag on main:
#
#   prod_YYYY_MM_DD_N      e.g. prod_2026_11_15_1  (N = counter for that day, starting at 1)
#
# Create and push one with `npm run release`. The deploy only runs when
#   1. the tag name has the right format,
#   2. the tagged commit is on main, and
#   3. the full CI suite (typecheck, unit, integration, browser and privacy tests) passes for
#      that exact commit.
#
# Required repository secrets: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit), CLOUDFLARE_ACCOUNT_ID
# Repository variables: VITE_BUYMEACOFFEE_URL, VITE_SOURCE_URL (optional), CLOUDFLARE_PROJECT_NAME
name: Deploy to production

on:
  push:
    tags: ['prod_*']

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check tag format and that the commit is on main
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^prod_[0-9]{4}_(0[1-9]|1[0-2])_(0[1-9]|[12][0-9]|3[01])_[1-9][0-9]*$ ]]; then
            echo "::error::Tag '$TAG' must look like prod_YYYY_MM_DD_N (e.g. prod_2026_11_15_1)."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points to $GITHUB_SHA, which is not on main."
            exit 1
          fi
          echo "Deploying $TAG ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [validate, test]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://segl.pages.dev
    steps:
      - name: Require Cloudflare secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Set the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README › Publisering)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BUYMEACOFFEE_URL: ${{ vars.VITE_BUYMEACOFFEE_URL }}
          VITE_SOURCE_URL: ${{ vars.VITE_SOURCE_URL }}
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.162.0'
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'segl' }}
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-message=${{ github.ref_name }}
